name: Deploy to GitHub Pages

# Two triggers, for two different sources of change:
#   - push: catches a manual edit pushed with a real user's own credentials
#     (e.g. mine).
#   - workflow_run: catches the scraper's own automated commits. A plain
#     "push" trigger does NOT fire for those — GitHub doesn't cascade
#     workflow runs from a push made with the default GITHUB_TOKEN, to
#     prevent runaway automation loops. Without this, Pages would only ever
#     redeploy from a human pushing by hand, never from the scheduled
#     scraper committing new data, which is exactly what happened here:
#     the scraper kept committing successfully for a full day while Pages
#     silently never redeployed any of it.
#
# No build step, no per-deploy cost either way — GitHub Pages just serves
# these files directly, unlike Netlify's build-minute-metered free tier, so
# an occasional redeploy that finds nothing new to show is harmless.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_run:
    workflows: ["Scrape South Shore Live Music"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
