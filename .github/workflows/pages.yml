name: Deploy to GitHub Pages

# Runs on every push to main that touches site/ — separate from the scraper's
# own schedule, so a manual edit (or the scraper's own commit) deploys right
# away without waiting on the scrape schedule. No build step, no per-deploy
# cost — GitHub Pages just serves these files directly, unlike Netlify's
# build-minute-metered free tier.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
