name: Deploy to GitHub Pages

# Runs on every push to main that touches site/ — separate from the scraper's
# own schedule, so a manual edit (or the scraper's own commit) deploys right
# away without waiting on the scrape schedule. No build step, no per-deploy
# cost — GitHub Pages just serves these files directly, unlike Netlify's
# build-minute-metered free tier.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
